[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="nova-offline-agent"
version="0.1.0"
description="NOVA — Neural Offline Verified Agent"
readme="README.md"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.8,<3","pydantic-settings>=2.4,<3"]
[project.optional-dependencies]
dev=["pytest>=8,<9","httpx>=0.27,<1","ruff>=0.6,<1"]
[tool.pytest.ini_options]
pythonpath=["backend"]
testpaths=["tests"]
[tool.ruff]
line-length=100
target-version="py311"
